type: object
description: RFC 7807 Problem Details
required:
  - type
  - title
  - status
  - detail
properties:
  type:
    type: string
    description: エラー種別
    example: not-found
  title:
    type: string
    description: エラータイトル
    example: Not Found
  status:
    type: integer
    description: HTTPステータスコード
    example: 404
  detail:
    type: string
    description: エラーの詳細メッセージ
    example: 漫画が見つかりません
