name: Deploy Docs to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "db/tbls/**"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check if DB schema changed
        id: schema-check
        run: |
          if git diff --name-only HEAD~1 HEAD | grep -qE '^db/tbls/'; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup tbls
        if: steps.schema-check.outputs.changed == 'true'
        uses: k1LoW/setup-tbls@v1

      - name: Setup Node.js
        if: steps.schema-check.outputs.changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        if: steps.schema-check.outputs.changed == 'true'
        run: npm ci

      - name: Generate ERD
        if: steps.schema-check.outputs.changed == 'true'
        run: npm run erd

      - name: Generate DB docs
        if: steps.schema-check.outputs.changed == 'true'
        run: tbls doc --rm-dist --config db/tbls/.tbls.yml json://db/tbls/schema.json

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
