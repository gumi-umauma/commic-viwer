# docs/ または db/tbls/ または api/ の変更時に GitHub Pages へドキュメントをデプロイする
name: Deploy Docs to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "db/tbls/**"
      - "api/**"

# GitHub Pages デプロイに必要な権限
permissions:
  contents: read
  pages: write
  id-token: write

# 同時デプロイを防止（進行中のデプロイは完了まで待つ）
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # schema.json が変わっていなければ DB ドキュメント生成をスキップ
      - name: Cache DB docs
        id: cache-db-docs
        uses: actions/cache@v4
        with:
          path: |
            docs/design/db/tables
            docs/design/db/erd
          key: db-docs-${{ hashFiles('db/tbls/schema.json') }}

      # --- キャッシュミス時のみ DB ドキュメントを再生成 ---
      - name: Setup tbls
        if: steps.cache-db-docs.outputs.cache-hit != 'true'
        uses: k1LoW/setup-tbls@v1

      - name: Setup Node.js
        if: steps.cache-db-docs.outputs.cache-hit != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        if: steps.cache-db-docs.outputs.cache-hit != 'true'
        run: npm ci

      # schema.json からテーブル定義ドキュメントを生成
      - name: Generate DB docs (tbls)
        if: steps.cache-db-docs.outputs.cache-hit != 'true'
        run: tbls doc --rm-dist --config db/tbls/.tbls.yml json://db/tbls/schema.json

      # ER図を生成
      - name: Generate ERD
        if: steps.cache-db-docs.outputs.cache-hit != 'true'
        run: npm run erd

      # コミット済みの bundled yaml を docs にコピー
      - name: Copy OpenAPI spec to docs
        run: cp api/openapi.bundled.yaml docs/design/api/openapi.yaml

      # --- docs/ 配下を Jekyll でビルドし Pages にアップロード ---
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  # build ジョブ完了後に GitHub Pages へデプロイ
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
