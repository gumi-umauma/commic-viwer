<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: "ja" }}">
  {%- include head.html -%}
  <body>
    {%- include header.html -%}

    <main class="page-content" aria-label="Content">
      <div class="wrapper">
        {{ content }}
      </div>
    </main>

    {%- include footer.html -%}

    <!-- Mermaid: kramdownが生成する <div class="language-mermaid"> を図に変換 -->
    <script type="module">
      import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';
      mermaid.initialize({ startOnLoad: false });

      document.querySelectorAll('.language-mermaid code').forEach((codeEl) => {
        const wrapper = codeEl.closest('.language-mermaid');
        const div = document.createElement('div');
        div.className = 'mermaid';
        div.textContent = codeEl.textContent;
        wrapper.replaceWith(div);
      });

      await mermaid.run();
    </script>
  </body>
</html>
